# Stage 3 deployment prep -- containerizes the same three processes the Windows dev
# setup runs manually (.claude/launch.json: psx-backend, psx-frontend, plus whatever
# Postgres instance backend/.env.example's DATABASE_URL points at). Does not include
# the scheduled price backfill (scripts/run_price_backfill.ps1) or ML/Kronos jobs --
# those are separate, periodic processes, not part of the always-on service set, and
# stay outside this file until they're moved to their own scheduler (cron/systemd-timer
# on whatever host eventually runs this, per Stage 3's "scheduled jobs" item).
#
# Local use: `docker compose up --build`, then run migrations once (`docker compose
# exec backend alembic upgrade head`) against the fresh db volume before the app has
# anything to serve.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psx
      POSTGRES_PASSWORD: psx
      POSTGRES_DB: psx_fertilizer
    ports:
      # Host port 55432, not 5432: many dev machines (including this one) already run a
      # native PostgreSQL install on 5432, and Docker Desktop on Windows can silently end up
      # in a half-broken port-forward state rather than a clean bind error when that happens.
      - "55432:5432"
    volumes:
      - psx_fertilizer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx -d psx_fertilizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Real secrets (SBP_EASYDATA_API_KEY, GEMINI_API_KEY, etc.) load from here, same
    # file backend/.env.example documents -- not committed, not duplicated into this
    # compose file's own `environment:` block.
    env_file:
      - ./backend/.env
    environment:
      # DATABASE_URL overrides whatever's in .env: inside this compose network the
      # database is reachable at the `db` service name, not localhost.
      DATABASE_URL: postgresql+psycopg2://psx:psx@db:5432/psx_fertilizer
    ports:
      # 8001, not 8000: Equity-research's own API (run_api.py) also defaults to 8000
      # -- 8001 is what this project's actual dev setup (.claude/launch.json) already
      # uses to avoid that collision when both are run together.
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  psx_fertilizer_db:
