## Final report structure (assemble in this order)

1. Executive investment view (3–5 sentences, posture + return expectation)
2. Company-health score + one-line rationale
3. Stock-attractiveness score + one-line rationale
4. Central market debate (what bull and bear are actually arguing)
5. 3–5 thesis pillars, each with its measurable falsifier
6. What is priced in (reverse valuation output)
7. Company & value-chain explanation
8. Sponsor, CEO & management analysis (promise-ledger verdict)
9. Subsidiary & associate map
10. 5–10 year normalized financial analysis
11. Earnings-quality & forensic review
12. Balance-sheet & refinancing assessment
13. Capital-allocation history & scorecard
14. Industry & peer analysis (PSX fertilizer peers)
15. ~5-year driver-based forecast
16. CAPM & APT risk analysis
17. DCF / comps / DDM valuation → fair-value range + expected total return
18. Base / bull / bear / stress cases
19. Catalysts & timeline
20. Ranked risks
21. Measurable falsifiers
22. Monitoring KPI dashboard
23. Questions for the next corporate briefing
24. Evidence register, missing sources & confidence level

Label every material claim throughout."""
