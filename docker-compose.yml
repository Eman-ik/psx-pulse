services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psx
      POSTGRES_PASSWORD: psx
      POSTGRES_DB: psx_fertilizer
    ports:
      # Host port 55432, not 5432: many dev machines (including this one) already run a
      # native PostgreSQL install on 5432, and Docker Desktop on Windows can silently end up
      # in a half-broken port-forward state rather than a clean bind error when that happens.
      - "55432:5432"
    volumes:
      - psx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx -d psx_fertilizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://psx:psx@db:5432/psx_fertilizer
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  psx_pgdata:
